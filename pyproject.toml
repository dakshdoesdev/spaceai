[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kilnwatch"
version = "0.1.0"
description = "Local SimSat/Sentinel-2 ingestion for brick kiln compliance triage."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kilnwatch-fetch-panipat = "kilnwatch.ingestion.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

