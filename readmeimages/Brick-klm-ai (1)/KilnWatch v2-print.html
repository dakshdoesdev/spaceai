<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KilnWatch — Brick kilns, caught from space.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..700;1,9..144,200..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    @page { size: A4 portrait; margin: 0; }
    @media print {
      html, body { background: var(--ink) !important; }
      *, *::before, *::after {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      .topbar { display: none !important; }
      .hero { min-height: auto !important; page-break-after: always; break-after: page; }
      .hero-bg, .hero-grain { position: absolute !important; }
      .hero-meta { padding-top: 40px !important; }
      .hero-main { padding: 60px 48px 50px !important; }
      .section { padding: 70px 48px !important; page-break-after: always; break-after: page; page-break-inside: avoid; }
      .footer { padding: 70px 48px 40px !important; page-break-before: always; break-before: page; }
      /* avoid splitting key blocks */
      .pullquote, .hook-card, .layer, .alert-card, .broken-card, .problem-stat,
      .workflow-step, .chain-step, .demo-result, .bw-banner, .pass-summary-card,
      .prior, .cool-item, .honesty-col, .next li {
        page-break-inside: avoid; break-inside: avoid;
      }
      .hero h1 { font-size: 92px !important; line-height: 0.92 !important; }
      .h-display { font-size: 56px !important; line-height: 1 !important; }
      .pullquote { font-size: 30px !important; margin: 36px 0 !important; }
      .layers, .broken-grid, .cool, .alerts-grid { grid-template-columns: 1fr 1fr !important; }
      .pass { grid-template-columns: 1fr !important; }
      .chain { grid-template-columns: 1fr !important; }
      .chain-tiles { position: static !important; flex-direction: row !important; flex-wrap: wrap !important; }
      .chain-stage { grid-template-columns: repeat(5, 1fr) !important; }
      .hook-aside { position: static !important; }
      a { text-decoration: none !important; color: inherit !important; }
      img { max-width: 100% !important; }
      /* hide scrubber-y interactive bits */
      .hero-foot .scroll::before { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="app1.jsx"></script>
  <script type="text/babel" src="app2.jsx"></script>
  <script type="text/babel" src="app3.jsx"></script>

  <script type="text/babel">
    const { useState } = React;
    function App() {
      const [open, setOpen] = useState(null);
      return (
        <>
          <Topbar />
          <Hero />
          <Hook />
          <Problem />
          <Hackathon />
          <Built />
          <Bandwidth />
          <Proof />
          <Pass onOpen={setOpen} />
          <LiquidAlerts onOpen={setOpen} />
          <Cool />
          <PriorArt />
          <Broken />
          <HonestyV2 />
          <NextSection />
          <FooterV2 />
          {open && <ModalV2 id={open} onClose={() => setOpen(null)} />}
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    (async () => {
      try { await document.fonts.ready; } catch (e) {}
      await new Promise(r => setTimeout(r, 1500));
      window.print();
    })();
  </script>
</body>
</html>
